<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf9f7;
      --border: #e2e1dc;
      --text: #1c1c1a;
      --muted: #6b6b68;
      --faint: #f3f2ef;
      --red: #c0392b;
      --ff: "DM Sans", system-ui, sans-serif;
      --mono: "DM Mono", monospace;
    }

    html, body {
      height: 100%;
      font-family: var(--ff);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .box { width: 100%; max-width: 360px; }

    .logo {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: -.02em;
      margin-bottom: .35rem;
    }

    .sub {
      font-size: .84rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .field { margin-bottom: 1rem; }

    .field label {
      display: block;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .4rem;
    }

    .field input {
      width: 100%;
      padding: .65rem .8rem;
      font-family: var(--mono);
      font-size: .9rem;
      letter-spacing: .06em;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--text); }

    .btn {
      width: 100%;
      padding: .7rem;
      font-family: var(--ff);
      font-size: .85rem;
      font-weight: 500;
      color: #fff;
      background: var(--text);
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: .25rem;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .8; }
    .btn:disabled { opacity: .4; cursor: default; }

    .error {
      font-size: .82rem;
      color: var(--red);
      margin-top: .85rem;
      display: none;
    }
    .error.show { display: block; }

    .hint {
      margin-top: 2rem;
      padding: .9rem 1rem;
      background: var(--faint);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: .76rem;
      color: var(--muted);
      line-height: 1.65;
    }
    .hint code {
      font-family: var(--mono);
      font-size: .74rem;
      background: var(--border);
      padding: .1em .35em;
      border-radius: 2px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="logo">Portfolio Admin</div>
      <h1>Sign in</h1>
      <p class="sub">Enter your admin password to access the dashboard.</p>

      <div class="field">
        <label>Password</label>
        <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn" id="btn" onclick="doLogin()">Sign in</button>
      <p class="error" id="err">Incorrect password. Please try again.</p>

      <div class="hint">
        Default password: <code>admin123</code><br/>
        To change it, update <code>ADMIN_HASH</code> in <code>admin/auth.js</code>.
        See the README for instructions.
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = "panel.html";

    document.getElementById("pw").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    async function doLogin() {
      const pw  = document.getElementById("pw").value;
      const btn = document.getElementById("btn");
      const err = document.getElementById("err");

      btn.disabled = true;
      btn.textContent = "Signing in…";
      err.classList.remove("show");

      const ok = await checkPassword(pw);
      if (ok) {
        setSession();
        window.location.href = "panel.html";
      } else {
        err.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }
  </script>
</body>
</html>
